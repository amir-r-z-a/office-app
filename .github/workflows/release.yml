# Builds the desktop installers and publishes them as a GitHub release.
#
# To release: change "version" in desktop/package.json and push to main. If that version has
# no release yet, this builds the Windows and macOS installers on real machines and publishes
# release v<version>. Installed apps find it and update themselves.
name: Release desktop app

on:
  push:
    branches: [main]
    paths:
      - desktop/**
      - .github/workflows/release.yml
  # Run by hand to build again, e.g. after a failed run.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$version already exists; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Will build and publish v$version."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the installer
        run: npm run dist --workspace desktop
      - uses: actions/upload-artifact@v4
        with:
          name: office-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/out/*.exe
            desktop/out/*.exe.blockmap
            desktop/out/*.dmg
            desktop/out/*-mac.zip
            desktop/out/latest*.yml

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          ls -la files
          gh release create "v$VERSION" files/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Office $VERSION" \
            --generate-notes
