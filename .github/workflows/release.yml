# Builds the desktop installers and publishes them as a GitHub release.
#
# To release: set the version in desktop/package.json, commit, then
#   git tag v1.2.3 && git push origin v1.2.3
# Installed apps find the new release and update themselves.
name: Release desktop app

on:
  push:
    tags: ['v*']
  # Run by hand to test the build without publishing a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but desktop/package.json says $version"
            exit 1
          fi
      - name: Build the installer
        run: npm run dist --workspace desktop
      - uses: actions/upload-artifact@v4
        with:
          name: office-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/out/*.exe
            desktop/out/*.exe.blockmap
            desktop/out/*.dmg
            desktop/out/*-mac.zip
            desktop/out/latest*.yml

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la files
          gh release create "$GITHUB_REF_NAME" files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Office ${GITHUB_REF_NAME#v}" \
            --generate-notes
